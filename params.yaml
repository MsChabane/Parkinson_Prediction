  run_name: "DVC_Multimodal_Pipeline_Run2"
  reuse_shared_run_id: true
  run_id_file: "artifacts/mlflow_run_id.txt"

download:
  source_run_id: "2b1d2b41a53c4a669a80f27fa853e82d"
  exp_tag: "exp20_resnet34_radam_lr0.0001_bs16_fr0.3"
